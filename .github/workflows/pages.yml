name: Deploy StreamMax Landing Page to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'guide.html'
      - 'streammax_icon_512.png'
      - 'screenshots/**'
      - '.nojekyll'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Static Artifact
        run: |
          mkdir -p _site
          cp index.html _site/
          cp guide.html _site/
          cp streammax_icon_512.png _site/
          cp -r screenshots _site/
          touch _site/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
